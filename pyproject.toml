[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaac"
version = "0.1.0"
description = "Lossless compressed BF16 KV cache with a fused decode-attention kernel, and a nano-vllm that serves from it"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gaac*", "nanovllm*"]
